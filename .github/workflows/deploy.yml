name: Deploy to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-ec2-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Deploy with Docker Compose over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            cd ~/dongguk-individual-research
            test "$(git branch --show-current)" = "main"
            git pull --ff-only origin main
            docker compose config --quiet
            docker compose build
            docker compose up -d
            docker compose ps

            attempt=1
            max_attempts=12
            while [ "$attempt" -le "$max_attempts" ]; do
              if status_code=$(curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' --connect-timeout 5 --max-time 10 \
                https://dongguk-research.duckdns.org); then
                case "$status_code" in
                  2[0-9][0-9])
                    echo "HTTPS check passed: HTTP $status_code (attempt $attempt/$max_attempts)"
                    exit 0
                    ;;
                esac
                echo "HTTPS check: HTTP $status_code (attempt $attempt/$max_attempts)"
              else
                echo "HTTPS request failed (attempt $attempt/$max_attempts)"
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep 5
              fi
              attempt=$((attempt + 1))
            done
            echo "HTTPS check failed after $max_attempts attempts" >&2
            exit 1
