server {
    listen 80;
    server_name dongguk-research.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://dongguk-research.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dongguk-research.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/dongguk-research.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dongguk-research.duckdns.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
