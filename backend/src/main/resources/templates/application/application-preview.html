<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<style>
  @page { size: A4 portrait; margin: 14mm 16mm; }
  body { margin: 0; color: #27313b; font-family: KoreanDocumentFont, sans-serif; font-size: 9pt; line-height: 1.5; }
  .masthead { border-top: 3pt solid #e77920; padding-top: 4mm; }
  .brand { color: #a7571d; font-size: 8pt; letter-spacing: 1px; margin: 0 0 2mm; }
  h1 { font-size: 22pt; margin: 0 0 2mm; font-weight: 700; letter-spacing: -1px; }
  .subtitle { margin: 0; color: #6e7780; font-size: 8pt; }
  h2 { font-size: 10pt; margin: 6mm 0 2mm; font-weight: 700; }
  .number { color: #d76b18; padding-right: 2mm; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { border-bottom: 0.6pt solid #dce1e5; padding: 2.1mm 2.6mm; vertical-align: top; }
  th { background: #f6f5f2; color: #5c6269; text-align: left; font-weight: normal; }
  td { white-space: pre-wrap; word-wrap: break-word; }
  .info { border-top: 0.8pt solid #aeb6bc; }
  .label { width: 17%; } .value { width: 33%; }
  .content { border: 0.6pt solid #dce1e5; padding: 3mm 4mm; margin-bottom: 2.5mm; }
  .content-label { color: #9a4d17; font-size: 8pt; margin: 0 0 1.5mm; }
  .content-text { margin: 0; white-space: pre-wrap; word-wrap: break-word; }
  .approval { page-break-inside: avoid; }
  .approval-note { margin: 0 0 3mm; font-size: 8pt; color: #66717a; }
  .signature td { height: 14mm; vertical-align: bottom; text-align: right; }
  .signature th { width: 17%; vertical-align: middle; }
  .date span { display: inline-block; width: 12mm; text-align: right; }
  .footer { margin-top: 5mm; padding-top: 2.5mm; border-top: 0.6pt solid #dce1e5; font-size: 7pt; color: #7c858c; }
  .footer p { margin: 0 0 1mm; }
</style>
</head>
<body>
  <div class="masthead">
    <p class="brand">DONGGUK UNIVERSITY · 컴퓨터·AI학부</p>
    <h1>개별연구 수강신청원</h1>
    <p class="subtitle"><span th:text="${application.semester}"></span> · 학생 신청 및 담당교수 확인</p>
  </div>
  <h2><span class="number">01</span> 신청자 정보</h2>
  <table class="info">
    <colgroup><col class="label"/><col class="value"/><col class="label"/><col class="value"/></colgroup>
    <tr><th>성명</th><td th:text="${application.studentName}"></td><th>학번</th><td th:text="${application.studentLoginId}"></td></tr>
    <tr><th>소속</th><td th:text="${application.studentDepartment}"></td><th>연락처</th><td th:text="${contact}"></td></tr>
    <tr><th>이메일</th><td colspan="3" th:text="${application.studentEmail}"></td></tr>
  </table>
  <h2><span class="number">02</span> 신청 과목 및 연구 정보</h2>
  <table class="info">
    <colgroup><col class="label"/><col class="value"/><col class="label"/><col class="value"/></colgroup>
    <tr><th>학년도 / 학기</th><td th:text="${application.semester}"></td><th>담당교수</th><td th:text="${application.professorName}"></td></tr>
    <tr><th>교과목 / 주제</th><td colspan="3" th:text="${application.courseName}"></td></tr>
    <tr><th>연구내용</th><td colspan="3" th:text="${application.researchDescription}"></td></tr>
  </table>
  <h2><span class="number">03</span> 신청 내용</h2>
  <div class="content"><p class="content-label">신청사유</p><p class="content-text" th:text="${application.applicationReason}"></p></div>
  <div class="content"><p class="content-label">연구목적</p><p class="content-text" th:text="${application.researchPurpose}"></p></div>
  <div class="approval">
    <h2><span class="number">04</span> 담당교수 확인</h2>
    <p class="approval-note">위 학생의 개별연구 신청 내용을 확인합니다.</p>
    <table class="info signature"><tr><th>확인일자</th><td class="date"><span>년</span><span>월</span><span>일</span></td><th>담당교수 서명</th><td>(서명 또는 인)</td></tr></table>
  </div>
  <div class="footer"><p>학생 입력 정보를 바탕으로 생성된 신청서입니다. 담당교수 확인 및 서명 후 제출해 주세요.</p><p>생성일시 <span th:text="${generatedAt}"></span></p></div>
</body>
</html>
